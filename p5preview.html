    <iframe 
      srcdoc="<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5.js Sketch</title>
    <script src="lib/p5.min.js"></script>
  </head>
  <body>
  <script>
  let circles = [];const initialNumCircles = 30;function setup() {createCanvas(600, 400);for (let i = 0; i < initialNumCircles; i++) {circles.push(new Circle(random(width), random(height)));}}function draw() {background(0, 50);for (let i = circles.length - 1; i >= 0; i--) {let circle = circles[i];circle.move();circle.display();}if (mouseIsPressed) {circles.push(new Circle(mouseX, mouseY));}if (circles.length > 200) {circles.splice(0, 1);}}class Circle {constructor(x, y) {this.x = x;this.y = y;this.radius = random(10, 30);this.vx = random(-3, 3);this.vy = random(-3, 3);this.color = color(random(255), random(255), random(255), 200);}move() {this.x += this.vx;this.y += this.vy;if (this.x + this.radius > width || this.x - this.radius < 0) {this.vx *= -1;}if (this.y + this.radius > height || this.y - this.radius < 0) {this.vy *= -1;}}display() {noStroke();fill(this.color);ellipse(this.x, this.y, this.radius * 2);}}
  </script>
  </body>
  </html>"
